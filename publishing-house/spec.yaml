# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "This advanced lab covers sovereign cloud architecture using the full Red Hat OpenShift Platform Plus suite across a three-cluster fleet (hub, EMEA HCP, and US managed cluster). Content is organized into three modules, Virtualization, AI Adoption, and Security and Sovereignty, plus an optional extra for Lightwell and image signing. Students enforce data residency and regulatory compliance through RHACM policy-as-code, demonstrate runtime security enforcement with RHACS, and use OpenShift Lightspeed for agentic troubleshooting, the MCP server, and the MCP gateway. Former supplementary governance exercises remain in the lab as optional sections at the end of Module 3."
    module_summaries:
      - title: "Virtualization"
        overview: "Students create an HCP/EMEA cluster via RHACM, then create a RHEL virtual machine named rhel9-lab-vm. OpenShift Lightspeed creates it first. If Lightspeed does not leave the machine running, students create the same machine from the RHEL 9 template. They then confirm the hub cluster is compliant through the Compliance Operator and RHACS, and review vulnerabilities for that virtual machine in RHACS or by asking Lightspeed to query RHACS. The EMEA cluster continues provisioning while students move on."
      - title: "AI Adoption"
        overview: "Students follow the OpenShift 5 First Look exercises: agentic troubleshooting, an MCP server for OpenShift and RHACS, and the MCP gateway in Red Hat Connectivity Link."
      - title: "Security and Sovereignty"
        overview: "The patient-portal application is already deployed on local-cluster and aws-us. Students write an RHACM policy for that application, enforce an RHACS runtime rule in the same namespace, attest the nodes and the frontend with ZTWIM, and rotate the frontend Service TLS certificate. Optional sections cover regional governance."
      - title: "Extra: Lightwell and trusted software supply chain"
        overview: "A 30 minute optional module. Students confirm the Lightwell pin for CVE-2022-40152 when that demo is present, then rebuild the patient-portal frontend from a Universal Base Image in Quay and sign it with cosign and Red Hat Trusted Artifact Signer."
    rcars_overlap_pct: 83
    rcars_top_matches:
      - title: "Hands-on lab with Red Hat OpenShift Platform Plus (2025)"
        ci_name: "sandboxes-gpte.opp-hol.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.opp-hol.prod"
        relevance_score: 83
        why_it_fits: "Directly covers the core stack — RHACM multi-cluster governance, RHACS runtime and policy enforcement, Red Hat Quay image security, and Policy-as-Code with Kyverno and GitOps — making it a strong match for platform engineers and DevSecOps practitioners targeting fleet governance and container security."
        workloads: []
      - title: "Build Secure, Streamlined Developer Workflows with Red Hat Advanced Developer Suite"
        ci_name: "published.rhads-secure-dev-workflows.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.rhads-secure-dev-workflows.prod"
        relevance_score: 60
        why_it_fits: "Covers RHACS, RHTAS, Red Hat Quay, cosign/keyless signing, and supply chain policy enforcement that are central to the request, but lacks RHACM multi-cluster fleet governance, GDPR/NIST policy-as-code, and sovereign on-premises AI components."
        workloads:
          - role: "ocp4_workload_rhacs"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_quay_operator"
            collection: "agnosticd.core_workloads"
          - role: "trusted_artifact_signer"
            collection: "rhpds.build_secured_dev_workflows"
      - title: "LB1464: Unifying DevSecOps: Secure, Standardized Application Delivery Across Containers (CNV)"
        ci_name: "summit-2026.lb1464-unified-devsecops-delivery-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=summit-2026.lb1464-unified-devsecops-delivery-cnv.prod"
        relevance_score: 58
        why_it_fits: "Covers RHTAS/cosign artifact signing, RHACS, Red Hat Quay, and policy-driven supply chain security, but lacks RHACM multi-cluster fleet governance, GDPR/NIST policy-as-code, and sovereign AI deployment."
        workloads:
          - role: "ocp4_workload_rhacs"
            collection: "agnosticd.core_workloads"
          - role: "trusted_artifact_signer"
            collection: "rhpds.build_secured_dev_workflows"
    catalog_gap: "No existing catalog item integrates all four sovereign cloud pillars — multi-cluster fleet governance with data residency policy-as-code, continuous compliance assurance across regulatory frameworks (GDPR, NIST 800-53, CIS, E8), container supply chain signing with RHTAS, and sovereign on-premises AI — within a single scenario. Existing labs cover subsets of this stack but require instructors to stitch together multiple labs to achieve the same breadth."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
