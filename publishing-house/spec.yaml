project:
  slug: "rh1-ocp5-opp"
  owner_email: "jialvare@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "both"
  description: "This hands-on OpenShift Platform Plus (OPP) lab environment offers a complete enterprise architecture for building, securing, and operating multi-cluster Kubernetes fleets at scale. Built on a hub-and-spoke model using Red Hat OpenShift Container Platform, the lab integrates the full OPP suite—utilizing Red Hat Advanced Cluster Management (RHACM) for global fleet governance and GitOps automation, Red Hat Advanced Cluster Security (RHACS) for continuous DevSecOps compliance and runtime threat detection, Red Hat Quay for enterprise-grade container registry management, and Red Hat OpenShift Data Foundation (ODF) for unified software-defined storage. Through practical, real-world scenarios, platform engineers, DevSecOps specialists, and SREs gain direct experience enforcing zero-trust security policies, automating multi-cluster observability, and managing resilient stateful workloads across hybrid cloud environments."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1146"
  workflow_id: "d02c43ac-917e-4f3c-ba06-a85ea5bcea62"

spec:
  title: "LB1161 - Sovereign Cloud Architecture with OpenShift, Multi-Cluster Data Residency and Compliance Management"
  learning_objectives:
    - "Deploy a Hosted Control Plane (HCP) cluster in an EMEA region using Red Hat Advanced Cluster Management and verify it is registered in the fleet inventory"
    - "Configure multi-cluster data residency and GDPR policy-as-code using RHACM Policies, Placements, and PlacementBindings targeting the EMEA cluster"
    - "Deploy containerized workloads across three clusters using Red Hat OpenShift GitOps (Argo CD) ApplicationSets"
    - "Configure multi-profile compliance scans (CIS, Essential 8, NERC-CIP, PCI-DSS, STIG) across clusters using RHACS and the Compliance Operator"
    - "Observe and verify real-time runtime security enforcement by triggering a RHACS policy violation and confirming pod termination"
    - "Build a container image from a Red Hat UBI golden base image and push it to a private Red Hat Quay registry"
    - "Sign container images using cosign backed by Red Hat Trusted Artifact Signer (Fulcio CA, Rekor transparency log, TUF) with OIDC identity verification"
    - "Deploy a Jupyter workbench on Red Hat OpenShift AI and execute a data science notebook on CPU-only infrastructure as a sovereign alternative to cloud AI services"
  modules:
    - id: module-01
      title: "Operations and Security"
      duration_min: 50
      status: not_started
    - id: module-02
      title: "Assurance"
      duration_min: 45
      status: not_started
    - id: module-03
      title: "Technology and Supply Chain"
      duration_min: 40
      status: not_started
    - id: module-04
      title: "Data and AI"
      duration_min: 20
      status: not_started
    - id: module-05
      title: "Supplementary Governance (Optional)"
      duration_min: 25
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.21"                # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:
      - "github.com"                   # named external service dependencies
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 3.25
  audience: "advanced"         # beginner | intermediate | advanced

